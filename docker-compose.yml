services:
  db:
    image: postgres:17
    container_name: learnhub-db
    environment:
      POSTGRES_DB: learnhub
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - learnhub-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d learnhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  learnhub-db-data: